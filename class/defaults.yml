parameters:
  steward:
    =_metadata:
      multi_tenant: true
    namespace: syn
    api_url: 'https://api.syn.vshn.net/'
    token: '?{vaultkv:${cluster:tenant}/${cluster:name}/steward/token}'
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    images:
      steward:
        image: docker.io/projectsyn/steward
        tag: 'v0.14.1@sha256:e5d21bab14b61bd35519a27ca13d76499f079b0e20ae70aceb7a8524cf63db33'
      argocd:
        image: quay.io/argoproj/argocd
        tag: 'v3.5.6@sha256:8e5cc5bb008df8a09dba439462e58c94c55b7735888d3ebde0c25fc05e4e5335'

    priority_class: system-cluster-critical
    additional_facts: {}
    additional_facts_config_label: 'steward.syn.tools/include-facts'
